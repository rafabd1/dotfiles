font_family JetBrainsMono Nerd Font
font_size 10
confirm_os_window_close 0

# Fish provides syntax highlighting, autosuggestions and completions.
# Keeping it local to Kitty avoids changing the login shell used by scripts.
shell /usr/bin/fish

background #000000
foreground #ffffff

# Caelestia regenerates this palette from the active wallpaper. The static
# colours above remain a fallback if the generated file does not exist yet.
include ~/.local/state/caelestia/theme/kitty.conf
